name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    # Linux, as the server runs. Tests that need hardware a runner may lack
    # (KVM, vsock, a kernel that enforces RLIMIT_AS) probe for it and skip with
    # the missing capability as the reason: see the skip summary at the end.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tests/constraints.txt
      - name: Install
        # textual: the terminal client's tests (its own installer provides it)
        run: python -m pip install -c tests/constraints.txt -r requirements.txt textual
      - name: Test
        run: python -m pytest -q -p no:cacheprovider -rs
